# ─────────────────────────────────────────────────────────────
# Platform Configuration — enable/disable scrapers and submitters
#
# Set enabled: true/false to control which platforms are active.
# Login sessions are automatically managed for enabled platforms
# that require authentication (login_required: true).
# ─────────────────────────────────────────────────────────────

scrape_from:
    naukri:
        enabled: true
        login_required: true
        login_url: https://www.naukri.com/nlogin/login
    instahyre:
        enabled: true
        login_required: true
        login_url: https://www.instahyre.com/candidate/login/
    linkedin:
        enabled: false
        login_required: true
        login_url: https://www.linkedin.com/login
    internshala:
        enabled: false
        login_required: true
        login_url: https://internshala.com/login
    unstop:
        enabled: false
        login_required: true
        login_url: https://unstop.com/login
    indeed:
        enabled: false
        login_required: true
        login_url: https://in.indeed.com/account/login
    hirist:
        enabled: false
        login_required: true
        login_url: https://www.hirist.tech/login
    cutshort:
        enabled: false
        login_required: true
        login_url: https://cutshort.io/login
    foundit:
        enabled: false
        login_required: true
        login_url: https://www.foundit.in/login

apply_on:
    # Handlers are URL-pattern-routed automatically — this section is
    # documentation only and does not enable/disable code paths.
    naukri:
        enabled: true
        note: session-based, uses auth/naukri_session.json
    instahyre:
        enabled: true
        note: session-based, uses auth/instahyre_session.json
    internshala:
        enabled: true
        note: session-based, uses auth/internshala_session.json
    unstop:
        enabled: true
        note: session-based, uses auth/unstop_session.json
    indeed:
        enabled: true
        note: session-based Quick Apply, uses auth/indeed_session.json
    linkedin:
        enabled: true
        note: session-based Easy Apply, uses auth/linkedin_session.json
    greenhouse:
        enabled: true
        note: no login needed; used for company Greenhouse ATS pages (via Indeed job_url_direct)
    lever:
        enabled: true
        note: no login needed; used for company Lever ATS pages (via Indeed job_url_direct)
    generic:
        enabled: true
        note: AI-guided fallback for any unrecognised ATS page; requires Gemini
